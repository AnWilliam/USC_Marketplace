<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | USC Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html">USC Marketplace</a>
        <nav><a href="items.html">Browse</a><a href="conversations.html">Messages</a></nav>
    </header>
    <main class="form-page">
        <form id="profileForm" class="panel">
            <h1>Profile</h1>
            <div id="profileSummary" class="summary"></div>
            <label>Profile picture URL <input type="url" name="profilePicture"></label>
            <label>Bio <textarea name="bio" rows="5"></textarea></label>
            <button type="submit" class="button primary">Save profile</button>
            <button type="button" id="logoutButton" class="button">Logout</button>
            <p id="result" class="result"></p>
        </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
