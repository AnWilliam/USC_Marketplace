<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell | USC Marketplace</title>
    <link rel="stylesheet" href="css/marketplace.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="market-body auth-unknown">
    <nav class="market-nav">
        <a class="market-brand" href="items.html">
            <span class="market-brand-mark">USC</span>
            <span>Marketplace</span>
        </a>
        <div class="market-nav-actions">
            <a class="nav-muted nav-always" href="items.html">Browse</a>
            <a class="nav-muted nav-user-only" href="conversations.html">Messages</a>
                <a class="nav-muted nav-user-only" href="wishlist.html">Wishlist</a>
            <a class="nav-muted nav-guest-only" href="login.html">Login</a>
            <a class="nav-muted nav-guest-only" href="register.html">Register</a>
            <a class="icon-profile nav-user-only" href="profile.html" title="Profile" aria-label="Profile">
                <img id="navProfileThumb" src="images/icon-profile.svg" alt="" width="22" height="22" decoding="async">
            </a>
            <button type="button" class="btn-nav-logout nav-user-only" id="siteNavLogout">Logout</button>
        </div>
    </nav>
    <main class="form-page">
        <form id="itemForm" class="panel">
            <h1>List an item</h1>
            <label>Title <input type="text" name="title" required></label>
            <label>Description <textarea name="description" rows="5"></textarea></label>
            <label>Price <input type="number" name="price" min="0.01" step="0.01" required></label>
            <label>Category
                <select name="categoryID" required>
                    <option value="1">Textbooks</option>
                    <option value="2">Electronics</option>
                    <option value="3">Furniture</option>
                    <option value="4">Clothing</option>
                    <option value="5">Other</option>
                </select>
            </label>
            <button type="submit" class="button primary">Publish</button>
            <p id="result" class="result"></p>
        </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/site-nav.js"></script>
    <script src="js/items.js"></script>
</body>
</html>
