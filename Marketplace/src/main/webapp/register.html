<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | USC Marketplace</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="items.html">USC Marketplace</a>
        <nav><a href="login.html">Login</a><a href="items.html">Browse</a></nav>
    </header>
    <main class="form-page">
        <form id="registerForm" class="panel">
            <h1>Create account</h1>
            <label>Name <input type="text" name="name" required></label>
            <label>USC email <input type="email" name="email" placeholder="you@usc.edu" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button type="submit" class="button primary">Register</button>
            <p id="result" class="result"></p>
            <p class="summary">Build: v4</p>
        </form>
    </main>
    <script src="js/api.js?v=v4"></script>
    <script src="js/auth.js?v=v4"></script>
</body>
</html>
