<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | USC Marketplace</title>
    <link rel="stylesheet" href="css/marketplace.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="market-body">
    <nav class="market-nav">
        <a class="market-brand" href="items.html">
            <span class="market-brand-mark">USC</span>
            <span>Marketplace</span>
        </a>
        <div class="market-nav-actions">
            <a class="nav-muted" href="items.html">Browse</a>
            <a class="nav-muted" href="login.html">Login</a>
        </div>
    </nav>
    <main class="form-page">
        <form id="registerForm" class="panel">
            <h1>Create account</h1>
            <label>Name <input type="text" name="name" required></label>
            <label>USC email <input type="email" name="email" placeholder="you@usc.edu" required></label>
            <label>Password <input type="password" name="password" required></label>
            <button type="submit" class="button primary">Register</button>
            <p id="result" class="result"></p>
        </form>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
