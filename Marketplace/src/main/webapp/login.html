<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Marketplace</title>
<style>
    body {
        background-color: #fff8f0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .login-container {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        padding: 32px 40px;
        min-width: 320px;
        border: 2px solid #990000;
    }
    h2 {
        color: #990000;
        margin-bottom: 24px;
        text-align: center;
        font-size: 2em;
        letter-spacing: 1px;
    }
    label {
        color: #990000;
        font-weight: bold;
    }
    input[type="email"], input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0 16px 0;
        border: 1px solid #990000;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1em;
    }
    button[type="submit"] {
        width: 100%;
        background-color: #990000;
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    button[type="submit"]:hover {
        background-color: #7c0000;
    }
</style>
</head>
<body>
    <div class="login-container">
        <h2>Log into Marketplace</h2>
        <form id="loginForm">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>
            <button type="submit">Login</button>
        </form>
        <div id="loginMessage" style="margin-top:16px;text-align:center;color:#990000;"></div>
        <div style="margin-top:24px;text-align:center;">
            <span>Don't have an account?</span>
            <a href="signup.html" style="color:#990000;font-weight:bold;text-decoration:none;margin-left:8px;">Sign up</a>
        </div>
    </div>
    <script>
// Handle login form submission with fetch to /api/login
const loginForm = document.getElementById('loginForm');
const loginMessage = document.getElementById('loginMessage');
loginForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
        const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });
        if (response.ok) {
            loginMessage.style.color = '#228B22';
            loginMessage.textContent = 'Login successful!';
            // Redirect or further logic here
        } else {
            const data = await response.json().catch(() => ({}));
            loginMessage.style.color = '#990000';
            loginMessage.textContent = data.message || 'Login failed. Please check your credentials.';
        }
    } catch (error) {
        loginMessage.style.color = '#990000';
        loginMessage.textContent = 'An error occurred. Please try again.';
    }
});
</script>
</body>
</html>
