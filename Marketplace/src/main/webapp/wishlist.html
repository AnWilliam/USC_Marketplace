<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist | USC Marketplace</title>
    <link rel="stylesheet" href="css/marketplace.css">
        <link rel="stylesheet" href="css/styles.css">
    
</head>
<body class="market-body auth-unknown">

<nav class="market-nav">
    <a class="market-brand" href="items.html">
        <span class="market-brand-mark">USC</span>
        <span>Marketplace</span>
    </a>
    <div class="market-nav-actions">
        <a class="nav-muted nav-always" href="items.html">Browse</a>
        <a class="nav-muted nav-user-only" href="#" id="navMessagesBtn">Messages</a>
        <a class="nav-muted nav-user-only" href="wishlist.html">Wishlist</a>
        <a class="icon-profile nav-user-only" href="profile.html" title="Profile" aria-label="Profile">
                    <img id="navProfileThumb" src="images/icon-profile.svg" alt="" width="22" height="22" decoding="async">
                </a>
    </div>
</nav>

<div class="market-layout">
    <div class="market-main">
        <h1>Your Wishlist</h1>
        <section id="wishlistGrid" class="items-grid"></section>
        <p id="wishlistEmpty" class="empty-state hidden">No items in your wishlist.</p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/site-nav.js"></script>
<script src="js/wishlist.js"></script>
<script>
// Robust chat popup loader and opener for wishlist
(function() {
    var navMessagesBtn = document.getElementById('navMessagesBtn');
    var chatPopupLoaded = false;
    var chatPopupLoading = false;
    var openChatPopup = function() {
        var chatPopup = document.getElementById('chatPopup');
        if (chatPopup) {
            chatPopup.classList.remove('closed');
            if (typeof loadPopupConversations === 'function') loadPopupConversations();
            if (typeof loadPopupMessages === 'function') loadPopupMessages();
        }
    };
    var loadChatPopup = function(callback) {
        if (chatPopupLoaded || chatPopupLoading) return;
        chatPopupLoading = true;
        fetch('chat-popup.html').then(function(resp) { return resp.text(); }).then(function(html) {
            var temp = document.createElement('div');
            temp.innerHTML = html;
            document.body.appendChild(temp.firstElementChild); // chatPopup
            document.body.appendChild(temp.querySelector('#chatPopupOpen'));
            var script = document.createElement('script');
            script.src = 'js/messages.js';
            script.onload = function() {
                chatPopupLoaded = true;
                chatPopupLoading = false;
                if (callback) callback();
            };
            document.body.appendChild(script);
        });
    };
    if (navMessagesBtn) {
        navMessagesBtn.addEventListener('click', function(e) {
            e.preventDefault();
            var chatPopup = document.getElementById('chatPopup');
            if (chatPopup) {
                openChatPopup();
            } else {
                loadChatPopup(openChatPopup);
            }
        });
    }
    window.addEventListener('DOMContentLoaded', function() {
        var chatPopupOpenBtn = document.getElementById('chatPopupOpen');
        if (chatPopupOpenBtn) {
            chatPopupOpenBtn.addEventListener('click', function() {
                var chatPopup = document.getElementById('chatPopup');
                if (!chatPopup) loadChatPopup(openChatPopup);
            });
        }
    });
})();
</script>

</body>
</html>
