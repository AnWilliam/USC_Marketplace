<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | USC Marketplace</title>
    <link rel="stylesheet" href="css/marketplace.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="market-body auth-unknown">
    <nav class="market-nav">
        <a class="market-brand" href="items.html">
            <span class="market-brand-mark">USC</span>
            <span>Marketplace</span>
        </a>
        <div class="market-nav-actions">
            <a class="nav-muted nav-always" href="items.html">Browse</a>
            <a class="nav-muted nav-user-only" href="conversations.html">Messages</a>
            <a class="nav-muted nav-guest-only" href="login.html">Login</a>
            <a class="nav-muted nav-guest-only" href="register.html">Register</a>
            <a class="icon-profile nav-user-only" href="profile.html" title="Profile" aria-label="Profile">
                <img id="navProfileThumb" src="images/icon-profile.svg" alt="" width="22" height="22" decoding="async">
            </a>
            <button type="button" class="btn-nav-logout nav-user-only" id="siteNavLogout">Logout</button>
        </div>
    </nav>
   <main class="form-page">
    <form id="profileForm" class="panel" novalidate>
        <h1>Profile</h1>

        <div id="profileSummary" class="summary"></div>

        <!-- profile image always visible -->
        <img id="profilePhotoPreview" class="profile-photo-preview" alt="Profile preview">

        <!-- EDIT MODE ONLY -->
        <div id="editControls" class="hidden">
            <label>Profile photo
                <input type="file" id="profilePhotoInput" accept="image/*">
            </label>

            <label>Or image URL
                <input type="url" name="profilePicture" placeholder="https://…">
            </label>
        </div>

        <!-- BIO -->
        <div>
            <label>Bio</label>

            <!-- VIEW MODE -->
            <div id="bioDisplay" class="bio-display"></div>

            <!-- EDIT MODE -->
            <textarea id="bioInput" name="bio" rows="5" class="hidden"
                placeholder="Tell buyers a bit about yourself"></textarea>
        </div>

        <button type="button" id="profileActionBtn" class="button primary">
            Edit profile
        </button>

        <p id="result" class="result"></p>
    </form>
</main>
    <script src="js/api.js"></script>
    <script src="js/site-nav.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
