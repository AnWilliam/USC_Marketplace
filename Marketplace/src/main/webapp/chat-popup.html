<!-- Chat Popup Widget -->
<div id="chatPopup" class="chat-popup closed">
    <div class="chat-popup-header">
        <span>Messages</span>
        <button id="chatPopupClose" title="Close">&times;</button>
    </div>
    <div class="chat-popup-body" style="display: flex; height: 400px;">
        <aside id="popupConversationList" class="popup-conv-list" style="width: 120px; overflow-y: auto; border-right: 1px solid #eee;"></aside>
        <div style="flex: 1; display: flex; flex-direction: column;">
            <section id="messageList" class="message-list" style="flex: 1; overflow-y: auto;"></section>
            <form id="messageForm" class="message-form" style="display: flex; gap: 4px; padding: 4px 0;">
                <input type="text" name="content" placeholder="Type a message" required style="flex: 1;">
                <button type="submit" class="button primary">Send</button>
            </form>
            <p id="result" class="result"></p>
        </div>
    </div>
</div>
<!-- Floating Chat Button -->
<button id="chatPopupOpen" class="chat-popup-open" title="Open chat">
    <img src="images/icon-profile.svg" alt="Chat" width="32" height="32">
</button>
