<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign Up - Marketplace</title>
<style>
    body {
        background-color: #fff8f0;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .signup-container {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        padding: 32px 40px;
        min-width: 320px;
        border: 2px solid #990000;
    }
    h2 {
        color: #990000;
        margin-bottom: 24px;
        text-align: center;
        font-size: 2em;
        letter-spacing: 1px;
    }
    label {
        color: #990000;
        font-weight: bold;
    }
    input[type="email"], input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0 16px 0;
        border: 1px solid #990000;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 1em;
    }
    button[type="submit"] {
        width: 100%;
        background-color: #990000;
        color: #fff;
        padding: 12px;
        border: none;
        border-radius: 4px;
        font-size: 1.1em;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
    }
    button[type="submit"]:hover {
        background-color: #7c0000;
    }
    .login-link {
        margin-top: 24px;
        text-align: center;
    }
    .login-link a {
        color: #990000;
        font-weight: bold;
        text-decoration: none;
        margin-left: 8px;
    }
</style>
</head>
<body>
    <div class="signup-container">
        <h2>Sign Up for Marketplace</h2>
        <form id="signupForm">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required><br>
            <button type="submit">Sign Up</button>
        </form>
        <div id="signupMessage" style="margin-top:16px;text-align:center;color:#990000;"></div>
        <div class="login-link">
            <span>Already have an account?</span>
            <a href="login.html">Log in</a>
        </div>
    </div>
    <script>
// Handle sign up form submission with fetch to /api/signup
const signupForm = document.getElementById('signupForm');
const signupMessage = document.getElementById('signupMessage');
signupForm.addEventListener('submit', async function(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        });
        if (response.ok) {
            signupMessage.style.color = '#228B22';
            signupMessage.textContent = 'Sign up successful! Redirecting to login...';
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        } else {
            const data = await response.json().catch(() => ({}));
            signupMessage.style.color = '#990000';
            signupMessage.textContent = data.message || 'Sign up failed. Please try again.';
        }
    } catch (error) {
        signupMessage.style.color = '#990000';
        signupMessage.textContent = 'An error occurred. Please try again.';
    }
});
</script>
</body>
</html>
